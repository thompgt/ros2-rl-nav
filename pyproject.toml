# Tooling config only. The ROS 2 package itself is built by ament/colcon via
# src/robot_rl_env/setup.py — this file does not package it.

[tool.pytest.ini_options]
testpaths = ["src/robot_rl_env/test"]
python_files = ["test_*.py"]
# -p no:launch_testing / no:launch_ros: ROS 2 Jazzy ships two pytest plugins
# written against pytest 7. Under the pytest the Dockerfile installs, one has a
# hookimpl signature pytest rejects outright and the other registers a hook
# that no longer exists -- so every pytest run in the container dies before
# collection, with an INTERNALERROR that names pluggy rather than ROS.
#
# The names are the pytest11 *entry point* names, not the distribution names:
# launch-testing-ros registers itself as `launch_ros`. `-p no:launch-testing-ros`
# is silently accepted and does nothing. Nothing here uses either plugin, and
# blocking one that is not installed (CI, the Windows host) is a no-op.
addopts = "-ra --strict-markers -p no:launch_testing -p no:launch_ros"
# Any test that hangs is a step-synchronization bug, and a hung test is
# indistinguishable from a slow one in CI. Fail loudly instead.
timeout = 120
markers = [
    "sim: requires a running Gazebo instance (slow; excluded from CI fast path)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", "install", "log"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # ROS 2 idiom: defaults constructed in signatures
    # SIM300 flags `assert value == pytest.approx(x)` as a Yoda condition and
    # would have us write the expected value on the left, which is backwards
    # for an assertion and reads worse everywhere it appears.
    "SIM300",
]

[tool.ruff.lint.isort]
# Without this, ruff classifies `robot_rl_env` as first- or third-party
# depending on the working directory it is invoked from -- so `ruff check` from
# the repo root and from src/robot_rl_env (which is what CI does) demand
# opposite import orders and one of them always fails.
known-first-party = ["robot_rl_env"]
