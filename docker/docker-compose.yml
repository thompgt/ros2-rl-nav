# All services share one image and bind-mount the repo at /ws, so an edit on
# the Windows host is visible in the container immediately — no rebuild for
# Python changes.
#
# Note: `network_mode: host` is deliberately NOT used. It behaves differently
# under Docker Desktop on Windows than on Linux. Each service instead gets its
# own network namespace and a distinct ROS_DOMAIN_ID, which is what Phase 3's
# parallel envs need anyway.

x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: ros2-rl-nav:jazzy
  volumes:
    - ../:/ws
  working_dir: /ws
  environment:
    ROS_DOMAIN_ID: "42"
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    QT_QPA_PLATFORM: offscreen
    PYTHONUNBUFFERED: "1"
  # Gazebo + a multithreaded executor need real shared memory; the 64 MB
  # default causes opaque crashes under load.
  shm_size: "1gb"
  init: true

services:
  # Interactive development shell.
  dev:
    <<: *common
    stdin_open: true
    tty: true
    command: bash

  # Fast tests, headless, exits non-zero on failure. This is what CI runs.
  test:
    <<: *common
    command: >
      bash -lc "colcon build --symlink-install --event-handlers console_direct+
      && source install/setup.bash
      && pytest -v src/robot_rl_env/test"

  # Phase 1 bridge verification — prints PASS/FAIL per check.
  verify:
    <<: *common
    command: bash -lc "scripts/verify_phase1.sh"

  # Phase 2 exit criteria — 100 random episodes, throughput, memory, command
  # timing. Slower than `test`; not part of CI.
  verify2:
    <<: *common
    command: bash -lc "scripts/verify_phase2.sh"

  # Phase 3. `make train` overrides this command to pass --algo/--seed/--n-envs;
  # this default is what `docker compose up train` reproduces. Port 6006 is
  # published for `make board`, which reuses this service.
  train:
    <<: *common
    ports:
      - "6006:6006"
    command: >
      bash -lc "colcon build --symlink-install
      && source install/setup.bash
      && python3 -m robot_rl_env.train --algo sac --seed 0"

  # Phase 4. The world runs unpaused and in real time; the policy node drives
  # it from an exported .pt. POLICY is set by `make deploy`; the default here
  # is what `docker compose up deploy` reproduces once a run has been exported.
  deploy:
    <<: *common
    environment:
      ROS_DOMAIN_ID: "42"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      POLICY: ${POLICY:-runs/sac-seed0/policy.pt}
    command: >
      bash -lc "colcon build --symlink-install
      && source install/setup.bash
      && ros2 launch robot_rl_env deploy.launch.py policy:=$$POLICY"

  # Phase 6. The same deployment, watched from a browser on the host.
  #
  # The published port is the whole access control: the monitor's POST route
  # sets a goal, and there is no authentication in front of it. Bound to
  # 127.0.0.1 on the host side deliberately -- a bare "8080:8080" would put a
  # robot's goal input on every interface of the machine.
  monitor:
    <<: *common
    ports:
      - "127.0.0.1:${MONITOR_PORT:-8080}:8080"
    environment:
      ROS_DOMAIN_ID: "42"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      POLICY: ${POLICY:-runs/sac-seed0/policy.pt}
    command: >
      bash -lc "colcon build --symlink-install
      && source install/setup.bash
      && ros2 launch robot_rl_env monitor.launch.py policy:=$$POLICY"
